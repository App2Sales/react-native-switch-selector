name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  compatibility:
    name: React Native ${{ matrix.react-native }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-native: ['0.76', '0.86', '0.87', '0.88']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run test:compatibility -- ${{ matrix.react-native }}
